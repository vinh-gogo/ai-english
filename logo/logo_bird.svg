<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="1024" height="1024" rx="220" fill="#090d16"/>

  <!-- Glowing outer circular ring -->
  <circle cx="512" cy="512" r="420" fill="none" stroke="url(#skyGrad)" stroke-width="4" opacity="0.15" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="420" fill="none" stroke="url(#skyGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Head -->
  <circle cx="512" cy="320" r="75" fill="url(#skyGrad)"/>

  <!-- Beak (glowing gold) -->
  <path d="M 570 295 A 45 45 0 0 1 635 320 A 45 45 0 0 1 560 355 Z" fill="url(#goldGrad)"/>

  <!-- Eye -->
  <circle cx="512" cy="310" r="10" fill="url(#goldGrad)"/>

  <!-- Teardrop Body -->
  <path d="M 512 385 A 210 210 0 0 0 380 595 A 130 130 0 0 0 644 595 A 210 210 0 0 0 512 385 Z" fill="url(#skyGrad)"/>

  <!-- Glowing Infinity Loop Wings -->
  <path d="M 512 595 C 402 485, 252 485, 252 595 C 252 705, 402 705, 512 595 C 622 485, 772 485, 772 595 C 772 705, 622 705, 512 595 Z" 
        fill="none" stroke="url(#skyGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#glow)"/>
  <path d="M 512 595 C 402 485, 252 485, 252 595 C 252 705, 402 705, 512 595 C 622 485, 772 485, 772 595 C 772 705, 622 705, 512 595 Z" 
        fill="none" stroke="url(#skyGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Large AI Spark (Upper-Right) -->
  <path d="M 720 240 A 55 55 0 0 0 775 295 A 55 55 0 0 0 720 350 A 55 55 0 0 0 665 295 A 55 55 0 0 0 720 240 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M 720 240 A 55 55 0 0 0 775 295 A 55 55 0 0 0 720 350 A 55 55 0 0 0 665 295 A 55 55 0 0 0 720 240 Z" fill="url(#goldGrad)"/>

  <!-- Small AI Spark (Lower-Left) -->
  <path d="M 300 300 A 35 35 0 0 0 335 335 A 35 35 0 0 0 300 370 A 35 35 0 0 0 265 335 A 35 35 0 0 0 300 300 Z" fill="url(#goldGrad)" opacity="0.8"/>
</svg>
